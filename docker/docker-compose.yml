services:
  freelancedz:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: freelancedz
    ports:
      - "8080:8080"
    environment:
      DATABASE_PATH: /app/data/leads.db
    volumes:
      - fdz_data:/app/data
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    restart: unless-stopped

volumes:
  fdz_data:
