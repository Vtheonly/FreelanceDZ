[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freelancedz-engine"
version = "3.1.0"
description = "Deterministic B2B sales-intelligence engine for the Algerian market. Python asyncio + C++20 SIMD native core."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FreelanceDZ"}]
keywords = ["lead-generation", "algeria", "b2b", "entity-resolution", "simd"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.5",
    "python-multipart>=0.0.20",
    "httpx[http2]>=0.28.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "phonenumbers>=8.13.52",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "click>=8.1.8",
    "rich>=13.9.4",
    "rapidfuzz>=3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
freelancedz = "cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*", "core*", "domain*", "engine*",
    "infrastructure*", "services*", "api*", "utils*", "benchmarks*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
