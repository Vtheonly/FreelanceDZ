[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freelancedz-engine"
version = "4.0.0"
description = "Deterministic B2B sales-intelligence engine for the Algerian market: discovery, audit, scoring, entity resolution, and geographic intelligence over the 58 wilayas."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FreelanceDZ"}]
keywords = ["lead-generation", "algeria", "b2b", "entity-resolution", "geospatial"]

dependencies = [
    # 0.115.14 floor: the 0.115.x patch that supports starlette<0.47, i.e.
    # the first range intersecting modern Streamlit's starlette>=0.46 (issue #3).
    "fastapi>=0.115.14",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "httpx[http2]>=0.28.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "phonenumbers>=8.13.52",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "click>=8.1.8",
    "rich>=13.9.4",
    "rapidfuzz>=3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
ui = [
    "streamlit>=1.41.0",
    "streamlit-folium>=0.23.0",
    "folium>=0.19.0",
    "pandas>=2.2.0",
]

[project.scripts]
freelancedz = "cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*", "core*", "domain*", "engine*",
    "infrastructure*", "services*", "api*", "utils*", "benchmarks*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
